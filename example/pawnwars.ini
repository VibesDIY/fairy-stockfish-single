# Pawn Wars: each side has eight pawns and nothing else.
# Reach the far rank with a pawn (it arrives as a queen, which is the flag piece), or take all of the other side's pawns, to win.
# A side with no legal move draws, as in chess.
[pawnwars:chess]
startFen = 8/pppppppp/8/8/8/8/PPPPPPPP/8 w - - 0 1
king = -
castling = false
extinctionValue = loss
extinctionPieceTypes = *
flagPiece = q
flagRegionWhite = *8
flagRegionBlack = *1
promotionPieceTypes = q
